aid: dominion-dynamics
name: Dominion Dynamics
description: 'Dominion Dynamics Inc. is a Canadian defence-technology company (Kanata/Ottawa,
  Ontario) building the autonomy stack for the Arctic and other extreme, infrastructure-constrained
  operating environments. It develops integrated autonomy, edge sensing, communications,
  and command-and-control systems for defence, security, and critical infrastructure.
  Its AuraNet platform is a peer-to-peer sensor mesh that fuses EO/IR/SAR imagery, SIGINT/EW/RF
  signals, telemetry, and structured reporting into a unified local intelligence stream that
  interoperates with existing allied C2 architectures, and its Aurion product is an open-source
  government procurement intelligence platform built on Canadian federal open data. Founded by
  Anduril alum Eliot Pence, the company raised a $139M CAD Series A (2026) led by Georgian. This
  profile currently has no public developer/API surface; the entry captures the company identity,
  security.txt, and llms.txt the company publishes.'
